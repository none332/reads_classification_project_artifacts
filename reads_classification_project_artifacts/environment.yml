name: reads_classification_env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.9
  - pip

  # General Python scientific stack
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn

  # RNA velocity analysis
  - anndata
  - scanpy
  - scvelo
  - loompy
  - velocyto.py

  # Genomics command-line tools
  - bedtools=2.31.0
  - samtools=1.16.1
  - star=2.7.10b
  - minimap2
  - subread
  - trim-galore=0.6.6
  - cutadapt
  - fastqc

  # Python genomics utilities
  - pysam
  - pybedtools
  - h5py
  - natsort

  # Read visualization
  - pygenometracks